<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <title>Kubernetes words: cluster, node, pod, container, replica</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
  </defs>

  <!-- You and the YAML -->
  <rect x="20" y="40" width="190" height="105" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="115" y="66" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">You write YAML</text>
  <text x="38" y="92" font-size="13" font-family="'DejaVu Sans Mono', monospace" fill="#374151">kind: Deployment</text>
  <text x="38" y="112" font-size="13" font-family="'DejaVu Sans Mono', monospace" fill="#1e40af" font-weight="bold">replicas: 3</text>
  <text x="38" y="132" font-size="13" font-family="'DejaVu Sans Mono', monospace" fill="#374151">image: web:1.0</text>
  <text x="115" y="170" font-size="13" fill="#374151" text-anchor="middle">kubectl apply -f app.yaml</text>
  <line x1="212" y1="95" x2="258" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cluster -->
  <rect x="260" y="20" width="640" height="300" rx="10" fill="#ffffff" stroke="#111827" stroke-width="2"/>
  <text x="280" y="46" font-size="16" font-weight="bold" fill="#111827">Cluster</text>
  <text x="350" y="46" font-size="13" fill="#6b7280">a group of machines that Kubernetes runs as one</text>

  <!-- Control plane -->
  <rect x="280" y="62" width="600" height="56" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="298" y="86" font-size="15" font-weight="bold" fill="#1e40af">Control plane</text>
  <text x="298" y="106" font-size="13" fill="#374151">API server + controllers: a controller sees "3 wanted, 2 running" and starts one more</text>

  <!-- Node 1 -->
  <rect x="280" y="132" width="290" height="172" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="296" y="155" font-size="15" font-weight="bold" fill="#111827">Node 1</text>
  <text x="358" y="155" font-size="13" fill="#6b7280">one machine</text>
  <rect x="296" y="168" width="122" height="96" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="357" y="188" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Pod</text>
  <rect x="308" y="198" width="98" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="357" y="218" font-size="12" fill="#374151" text-anchor="middle">container</text>
  <text x="357" y="252" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">replica 1</text>
  <rect x="432" y="168" width="122" height="96" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="493" y="188" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Pod</text>
  <rect x="444" y="198" width="98" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="493" y="218" font-size="12" fill="#374151" text-anchor="middle">container</text>
  <text x="493" y="252" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">replica 2</text>
  <text x="425" y="290" font-size="12" fill="#6b7280" text-anchor="middle">pods on a node share its kernel</text>

  <!-- Node 2 -->
  <rect x="590" y="132" width="290" height="172" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="606" y="155" font-size="15" font-weight="bold" fill="#111827">Node 2</text>
  <text x="668" y="155" font-size="13" fill="#6b7280">one machine</text>
  <rect x="606" y="168" width="122" height="96" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="667" y="188" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Pod</text>
  <rect x="618" y="198" width="98" height="30" rx="4" fill="#ffffff" stroke="#9ca3af"/>
  <text x="667" y="218" font-size="12" fill="#374151" text-anchor="middle">container</text>
  <text x="667" y="252" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">replica 3</text>
  <rect x="742" y="168" width="122" height="96" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="803" y="188" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Sandbox pod</text>
  <rect x="754" y="198" width="98" height="30" rx="4" fill="#ffffff" stroke="#b91c1c"/>
  <text x="803" y="218" font-size="12" fill="#b91c1c" text-anchor="middle">agent</text>
  <text x="803" y="252" font-size="12" fill="#374151" text-anchor="middle">one pod, stable name</text>
  <text x="735" y="290" font-size="12" fill="#6b7280" text-anchor="middle">the agent's neighbors are other pods</text>

  <!-- Legend -->
  <text x="20" y="352" font-size="14" fill="#111827"><tspan font-weight="bold">Pod:</tspan> the smallest thing Kubernetes runs, one or more containers.</text>
  <text x="20" y="376" font-size="14" fill="#111827"><tspan font-weight="bold">Replica:</tspan> one identical copy of a pod. Ask for 3, and Kubernetes keeps 3 running, replacing any that die.</text>
</svg>
