<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <title>The lab: same agent, two boxes</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
  </defs>

  <!-- Source -->
  <rect x="345" y="20" width="230" height="60" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="460" y="46" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle">Same agent image</text>
  <text x="460" y="66" font-size="13" fill="#374151" text-anchor="middle">same attack script</text>
  <line x1="400" y1="82" x2="260" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="520" y1="82" x2="660" y2="118" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Unsecured -->
  <rect x="30" y="120" width="420" height="245" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="240" y="150" font-size="16" font-weight="bold" fill="#b91c1c" text-anchor="middle">Box 1: plain Pod, default settings</text>
  <text x="50" y="186" font-size="14" font-weight="bold" fill="#b91c1c">BREACH</text>
  <text x="130" y="186" font-size="14" fill="#374151">stole a prod database password</text>
  <text x="50" y="218" font-size="14" font-weight="bold" fill="#b91c1c">BREACH</text>
  <text x="130" y="218" font-size="14" fill="#374151">read the cluster's master key</text>
  <text x="50" y="250" font-size="14" font-weight="bold" fill="#b91c1c">BREACH</text>
  <text x="130" y="250" font-size="14" fill="#374151">saw every program on the machine</text>
  <text x="50" y="282" font-size="14" font-weight="bold" fill="#b91c1c">BREACH</text>
  <text x="130" y="282" font-size="14" fill="#374151">ran as root, wrote to its own disk</text>
  <text x="240" y="340" font-size="14" font-style="italic" fill="#7f1d1d" text-anchor="middle">a root shell on your cluster</text>

  <!-- Secured -->
  <rect x="470" y="120" width="420" height="245" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="680" y="150" font-size="16" font-weight="bold" fill="#15803d" text-anchor="middle">Box 2: hardened Sandbox</text>
  <text x="490" y="186" font-size="14" font-weight="bold" fill="#15803d">CONTAINED</text>
  <text x="590" y="186" font-size="14" fill="#374151">no keys in the box</text>
  <text x="490" y="218" font-size="14" font-weight="bold" fill="#15803d">CONTAINED</text>
  <text x="590" y="218" font-size="14" fill="#374151">no view of the machine's files</text>
  <text x="490" y="250" font-size="14" font-weight="bold" fill="#15803d">CONTAINED</text>
  <text x="590" y="250" font-size="14" fill="#374151">sees only its own programs</text>
  <text x="490" y="282" font-size="14" font-weight="bold" fill="#15803d">CONTAINED</text>
  <text x="590" y="282" font-size="14" fill="#374151">not root, read-only disk</text>
  <text x="490" y="314" font-size="14" font-weight="bold" fill="#15803d">CONTAINED</text>
  <text x="590" y="314" font-size="14" fill="#374151">network closed</text>
  <text x="680" y="350" font-size="14" font-style="italic" fill="#14532d" text-anchor="middle">only the configuration changed</text>
</svg>
