<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <title>Warm pool: boxes ready and waiting</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/></marker>
  </defs>

  <!-- Cold start -->
  <text x="40" y="34" font-size="16" font-weight="bold" fill="#111827">Without a pool: start a box when asked</text>
  <rect x="40" y="50" width="120" height="50" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="100" y="80" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">agent asks</text>
  <line x1="162" y1="75" x2="198" y2="75" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="50" width="520" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="460" y="80" font-size="14" fill="#b91c1c" text-anchor="middle">pull image, boot runtime, start box: 10 to 30 seconds of waiting</text>
  <line x1="722" y1="75" x2="758" y2="75" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="760" y="50" width="120" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="820" y="80" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">box ready</text>

  <!-- Warm pool -->
  <text x="40" y="150" font-size="16" font-weight="bold" fill="#111827">With a warm pool: like taxis waiting at a rank</text>
  <rect x="40" y="170" width="460" height="130" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="270" y="195" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">warm pool: boxes already started</text>
  <rect x="65" y="212" width="90" height="55" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="110" y="244" font-size="13" fill="#15803d" text-anchor="middle">ready</text>
  <rect x="170" y="212" width="90" height="55" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="215" y="244" font-size="13" fill="#15803d" text-anchor="middle">ready</text>
  <rect x="275" y="212" width="90" height="55" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text x="320" y="244" font-size="13" fill="#15803d" text-anchor="middle">ready</text>
  <rect x="380" y="212" width="90" height="55" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="425" y="238" font-size="12" fill="#6b7280" text-anchor="middle">refilling</text>
  <text x="425" y="254" font-size="12" fill="#6b7280" text-anchor="middle">itself</text>

  <rect x="560" y="200" width="120" height="70" rx="8" fill="#eff6ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="620" y="230" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">agent asks</text>
  <text x="620" y="250" font-size="12" fill="#374151" text-anchor="middle">(a "claim")</text>
  <line x1="558" y1="235" x2="502" y2="235" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <rect x="720" y="200" width="160" height="70" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="800" y="230" font-size="14" font-weight="bold" fill="#15803d" text-anchor="middle">box in hand</text>
  <text x="800" y="250" font-size="13" fill="#374151" text-anchor="middle">under 2 seconds</text>
  <line x1="682" y1="235" x2="718" y2="235" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
</svg>
