<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <title>Four ways out of a box with default settings</title>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/></marker>
  </defs>

  <text x="460" y="28" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">A box on default settings has four ways out</text>

  <!-- The box -->
  <rect x="345" y="120" width="230" height="150" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="460" cy="195" r="34" fill="#b91c1c"/>
  <text x="460" y="200" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">agent</text>
  <text x="460" y="255" font-size="13" fill="#6b7280" text-anchor="middle">plain Pod, defaults</text>

  <!-- Four exits -->
  <rect x="30" y="60" width="270" height="85" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="45" y="88" font-size="15" font-weight="bold" fill="#b91c1c">1. Keys under the doormat</text>
  <text x="45" y="111" font-size="13" fill="#374151">an admin API token is placed</text>
  <text x="45" y="129" font-size="13" fill="#374151">inside the box automatically</text>
  <line x1="345" y1="160" x2="302" y2="115" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>

  <rect x="620" y="60" width="270" height="85" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="635" y="88" font-size="15" font-weight="bold" fill="#b91c1c">2. A hatch to the basement</text>
  <text x="635" y="111" font-size="13" fill="#374151">the machine's own files are</text>
  <text x="635" y="129" font-size="13" fill="#374151">mounted inside the box</text>
  <line x1="575" y1="160" x2="618" y2="115" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>

  <rect x="30" y="250" width="270" height="85" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="45" y="278" font-size="15" font-weight="bold" fill="#b91c1c">3. Everyone is the landlord</text>
  <text x="45" y="301" font-size="13" fill="#374151">the program runs as root and</text>
  <text x="45" y="319" font-size="13" fill="#374151">can rewrite its own files</text>
  <line x1="345" y1="235" x2="302" y2="285" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>

  <rect x="620" y="250" width="270" height="85" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="635" y="278" font-size="15" font-weight="bold" fill="#b91c1c">4. The front door is open</text>
  <text x="635" y="301" font-size="13" fill="#374151">it can connect to anything</text>
  <text x="635" y="319" font-size="13" fill="#374151">on the network</text>
  <line x1="575" y1="235" x2="618" y2="285" stroke="#b91c1c" stroke-width="2" marker-end="url(#r)"/>

  <text x="460" y="362" font-size="14" font-weight="bold" fill="#111827" text-anchor="middle">None of this needs anything exotic. Security is opt-in.</text>
</svg>
